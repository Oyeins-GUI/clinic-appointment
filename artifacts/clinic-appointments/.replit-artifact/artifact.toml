kind = "web"
previewPath = "/"
title = "Clinic Appointment System"
description = "A patient-friendly clinic booking app for viewing doctor availability, reserving appointments, receiving confirmations, and managing basic clinic and patient information."
version = "1.0.0"
id = "artifacts/clinic-appointments"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24688

[services.development]
run = "pnpm --filter @workspace/clinic-appointments run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinic-appointments", "run", "build" ]
serve = "static"
publicDir = "artifacts/clinic-appointments/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24688"
BASE_PATH = "/"
